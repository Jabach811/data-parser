  body.compact-workbench .cw-workspace-header {
    top: 90px;
    min-height: 48px;
    margin-bottom: var(--cw-space-2);
    padding-block: 6px;
  }

  body.compact-workbench .cw-workspace-heading span {
    display: none;
  }

  body.compact-workbench .cw-workspace-heading strong {
    font-size: 14px !important;
  }

  body.compact-workbench .cw-parse-action {
    min-height: 32px;
    padding-inline: 10px;
    font-size: 12px !important;
  }

  body.compact-workbench .page-canvas {
    gap: var(--cw-space-2) !important;
  }

  body.compact-workbench .step-block,
  body.compact-workbench .reports-canvas-list,
  body.compact-workbench .reports-canvas-out {
    padding: var(--cw-space-3) !important;
  }

  body.compact-workbench .step-block-head {
    flex-direction: row !important;
    align-items: center !important;
    padding-bottom: var(--cw-space-2) !important;
  }

  body.compact-workbench .step-block-head > div {
    flex-direction: column !important;
    align-items: flex-start !important;
    gap: 2px !important;
  }

  body.compact-workbench .setup-canvas-card,
  body.compact-workbench .field-row,
  body.compact-workbench .kpi-canvas,
  body.compact-workbench .kpi-canvas-side,
  body.compact-workbench .cw-review-details,
  body.compact-workbench .export-canvas-tiles,
  body.compact-workbench .reports-canvas {
    grid-template-columns: minmax(0, 1fr) !important;
  }

  body.compact-workbench .kpi-canvas-spotlight,
  body.compact-workbench .kpi-tile {
    border-right: 0 !important;
    border-bottom: 1px solid var(--cw-line) !important;
  }

  body.compact-workbench .kpi-tile:last-child {
    border-bottom: 0 !important;
  }

  body.compact-workbench .parse-metric {
    padding-inline: var(--cw-space-2) !important;
  }

  body.compact-workbench .cw-review-details .cw-detail-item:first-child {
    grid-column: auto;
  }

  body.compact-workbench .report-card-head,
  body.compact-workbench .report-card-actions {
    align-items: flex-start !important;
    flex-direction: column !important;
  }
}

@media (max-width: 430px) {
  body.compact-workbench .cw-rail .pill {
    gap: 3px !important;
    padding-inline: 3px !important;
    font-size: 10px !important;
  }

  body.compact-workbench .cw-rail .pill .num {
    display: none !important;
  }

  body.compact-workbench .topnav .status {
    padding-inline: 7px !important;
    font-size: 11px !important;
  }

  body.compact-workbench .parse-complete-metrics {
    grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
  }

  body.compact-workbench .parse-metric strong {
    font-size: 16px !important;
  }
}

@media (prefers-reduced-motion: reduce) {
  body.compact-workbench *,
  body.compact-workbench *::before,
  body.compact-workbench *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
<script id="compact-workbench-layout-adapter">
(function () {
  "use strict";

  var body = document.body;
  if (!body || body.classList.contains("compact-workbench")) {
    return;
  }

  var topnav = document.querySelector(".topnav");
  var pageCanvas = document.querySelector(".page-canvas");
  var navSteps = topnav ? topnav.querySelector(".nav-steps") : null;
  if (!topnav || !pageCanvas || !navSteps) {
    return;
  }

  function createNode(tagName, className, textValue) {
    var node = document.createElement(tagName);
    if (className) {
      node.className = className;
    }
    if (typeof textValue === "string") {
      node.textContent = textValue;
    }
    return node;
  }

  function setButtonLabel(button, label) {
    button.setAttribute("aria-label", label);
    button.setAttribute("data-label", label);
    button.setAttribute("title", label);
  }

  body.classList.add("compact-workbench");

  var shell = createNode("div", "cw-shell");
  body.insertBefore(shell, topnav);
  shell.appendChild(topnav);

  var rail = createNode("aside", "cw-rail");
  rail.setAttribute("aria-label", "Workbook sections");
  navSteps.setAttribute("aria-label", "Workbook sections");
  rail.appendChild(navSteps);
  shell.appendChild(rail);

  var main = createNode("div", "cw-main");
  shell.appendChild(main);

  var workspaceHeader = createNode("div", "cw-workspace-header");
  var workspaceHeading = createNode("div", "cw-workspace-heading");
  var workspaceEyebrow = createNode("span", "", "Workspace");
  var workspaceTitle = createNode("strong", "", "Configure");
  workspaceHeading.appendChild(workspaceEyebrow);
  workspaceHeading.appendChild(workspaceTitle);
  workspaceHeader.appendChild(workspaceHeading);

  var fileInput = document.getElementById("fileInput");
  var parseAction = createNode("label", "cw-parse-action", "Choose & Parse");
  parseAction.setAttribute("for", "fileInput");
  parseAction.setAttribute("role", "button");
  parseAction.setAttribute("tabindex", "0");
  parseAction.setAttribute("aria-label", "Choose source files and begin parsing");
  workspaceHeader.appendChild(parseAction);
  main.appendChild(workspaceHeader);
  main.appendChild(pageCanvas);

  var navInner = topnav.querySelector(".nav-inner");
  var navRight = topnav.querySelector(".nav-right");
  var jobContext = createNode("div", "cw-job-context");
  var jobContextLabel = createNode("span", "", "Current job");
  var jobContextValue = createNode("strong", "", "No job selected");
  jobContext.appendChild(jobContextLabel);
  jobContext.appendChild(jobContextValue);
  if (navInner && navRight) {
    navInner.insertBefore(jobContext, navRight);
  }

  var stepButtons = navSteps.querySelectorAll(".pill[data-step-jump]");
  var sectionLabels = ["Configure", "Review", "Export"];
  for (var stepIndex = 0; stepIndex < stepButtons.length; stepIndex += 1) {
    setButtonLabel(stepButtons[stepIndex], sectionLabels[stepIndex] || ("Step " + String(stepIndex + 1)));
  }

  var reportsSection = pageCanvas.querySelector(".reports-canvas");
  var reportsButton = createNode("button", "pill", " Reports");
  reportsButton.type = "button";
  reportsButton.setAttribute("data-workbench-jump", "reports");
  setButtonLabel(reportsButton, "Reports");
  var reportsNumber = createNode("span", "num", "04");
  reportsButton.insertBefore(reportsNumber, reportsButton.firstChild);
  navSteps.appendChild(reportsButton);
  if (reportsSection) {
    reportsSection.setAttribute("data-workbench-panel", "reports");
    reportsSection.setAttribute("tabindex", "-1");
  }

  function addGroupHeading(group, title, note) {
    var heading = createNode("div", "cw-group-heading");
    heading.appendChild(createNode("strong", "", title));
    heading.appendChild(createNode("span", "", note));
    group.appendChild(heading);
  }

  var setupCard = pageCanvas.querySelector(".setup-canvas-card");
  if (setupCard) {
    var sourceBlock = setupCard.querySelector(".field-block");
    var fieldRow = setupCard.querySelector(".field-row");
    var inputModeNote = document.getElementById("inputModeNote");
    var fileInputBlock = document.getElementById("fileInputBlock");
    var loadingBox = document.getElementById("loadingBox");
    var errorText = document.getElementById("errorText");

    var jobGroup = createNode("section", "cw-config-group");
    addGroupHeading(jobGroup, "Job details", "Choose the source and identify the conversion job.");
    if (sourceBlock) jobGroup.appendChild(sourceBlock);
    if (fieldRow) jobGroup.appendChild(fieldRow);

    var filesGroup = createNode("section", "cw-config-group");
    addGroupHeading(filesGroup, "Source files", "Files parse locally as soon as they are selected.");
    if (inputModeNote) filesGroup.appendChild(inputModeNote);
    if (fileInputBlock) filesGroup.appendChild(fileInputBlock);
    if (loadingBox) filesGroup.appendChild(loadingBox);
    if (errorText) filesGroup.appendChild(errorText);

    setupCard.appendChild(jobGroup);
    setupCard.appendChild(filesGroup);
  }

  function makeDisclosure(label, regionId, detailNode, summaryNode) {
    if (!detailNode) {
      return null;
    }

    var item = createNode("section", "cw-detail-item");
    var head = createNode("div", "cw-detail-head");
    if (summaryNode) {
      var summary = createNode("div", "cw-detail-summary");
      summary.appendChild(summaryNode);
      head.appendChild(summary);
    } else {
      head.appendChild(createNode("strong", "cw-detail-summary", label));
    }

    var toggle = createNode("button", "cw-detail-toggle", "Details");
    toggle.type = "button";
    toggle.setAttribute("aria-expanded", "false");
    toggle.setAttribute("aria-controls", regionId);
    toggle.setAttribute("aria-label", "Show " + label.toLowerCase());
    head.appendChild(toggle);

    var region = createNode("div", "cw-detail-region");
    region.id = regionId;
    region.hidden = true;
    region.appendChild(detailNode);

    toggle.addEventListener("click", function () {
      var willOpen = toggle.getAttribute("aria-expanded") !== "true";
      toggle.setAttribute("aria-expanded", willOpen ? "true" : "false");
      toggle.textContent = willOpen ? "Hide" : "Details";
      region.hidden = !willOpen;
    });

    item.appendChild(head);
    item.appendChild(region);
    return item;
  }

  var reviewSection = pageCanvas.querySelector('[data-step-panel="2"]');
  if (reviewSection) {
    var reviewDetails = createNode("div", "cw-review-details");
    var discardWrap = document.getElementById("discardFlipWrap");
    var sourceWrap = document.getElementById("sourceFlipWrap");
    var fundWrap = document.getElementById("fundFlipWrap");
    var sourceClip = document.getElementById("sourceBreakdownClip");
    var fundClip = document.getElementById("fundBreakdownClip");
    var discardBack = discardWrap ? discardWrap.querySelector(".parse-complete-back") : null;
    var sourceBack = sourceWrap ? sourceWrap.querySelector(".breakdown-flip-back") : null;
    var fundBack = fundWrap ? fundWrap.querySelector(".breakdown-flip-back") : null;
    var discardNote = discardBack ? discardBack.querySelector(".parse-complete-back-note") : null;
    if (discardNote) {
      discardNote.textContent = "Review parser exceptions and add custom report codes when needed.";
    }

    var discardDisclosure = makeDisclosure("Discarded line detail", "cw-discard-detail", discardBack, null);
    var sourceDisclosure = makeDisclosure("Source totals detail", "cw-source-detail", sourceBack, sourceClip);
    var fundDisclosure = makeDisclosure("Fund totals detail", "cw-fund-detail", fundBack, fundClip);
    if (discardDisclosure) reviewDetails.appendChild(discardDisclosure);
    if (sourceDisclosure) reviewDetails.appendChild(sourceDisclosure);
    if (fundDisclosure) reviewDetails.appendChild(fundDisclosure);

    var validationPanel = document.getElementById("summaryValidationPanel");
    if (reviewDetails.childNodes.length && validationPanel) {
      reviewSection.insertBefore(reviewDetails, validationPanel);
    }
  }

  function syncJobContext() {
    var caseInput = document.getElementById("caseNumberInput");
    var planInput = document.getElementById("planNameInput");
    var sourceTitle = document.getElementById("dataSourceCardTitle");
    var caseValue = caseInput ? caseInput.value.trim() : "";
    var planValue = planInput ? planInput.value.trim() : "";
    var sourceValue = sourceTitle ? sourceTitle.textContent.trim() : "";
    var parts = [];
    if (planValue) parts.push(planValue);
    if (caseValue) parts.push("Case " + caseValue);
    if (!parts.length && sourceValue && sourceValue !== "Select a Data Source") parts.push(sourceValue);
    jobContextValue.textContent = parts.length ? parts.join(" · ") : "No job selected";
  }

  var caseNumberInput = document.getElementById("caseNumberInput");
  var planNameInput = document.getElementById("planNameInput");
  var dataSourceCardTitle = document.getElementById("dataSourceCardTitle");
  if (caseNumberInput) caseNumberInput.addEventListener("input", syncJobContext);
  if (planNameInput) planNameInput.addEventListener("input", syncJobContext);
  if (dataSourceCardTitle && window.MutationObserver) {
    new MutationObserver(syncJobContext).observe(dataSourceCardTitle, { childList: true, subtree: true, characterData: true });
  }
  syncJobContext();

  function syncParseAction() {
    var isDisabled = !fileInput || fileInput.disabled;
    parseAction.classList.toggle("is-disabled", isDisabled);
    parseAction.setAttribute("aria-disabled", isDisabled ? "true" : "false");
    parseAction.setAttribute("tabindex", isDisabled ? "-1" : "0");
  }

  parseAction.addEventListener("keydown", function (event) {
    if ((event.key === "Enter" || event.key === " ") && fileInput && !fileInput.disabled) {
      event.preventDefault();
      fileInput.click();
    }
  });
  if (fileInput && window.MutationObserver) {
    new MutationObserver(syncParseAction).observe(fileInput, { attributes: true, attributeFilter: ["disabled"] });
  }
  syncParseAction();

  var navigationEntries = [];
  for (var navIndex = 0; navIndex < stepButtons.length; navIndex += 1) {
    var stepValue = stepButtons[navIndex].getAttribute("data-step-jump");
    var stepSection = pageCanvas.querySelector('[data-step-panel="' + stepValue + '"]');
    if (stepSection) {
      navigationEntries.push({ button: stepButtons[navIndex], section: stepSection, label: sectionLabels[navIndex] || "Workspace" });
    }
  }
  if (reportsSection) {
    navigationEntries.push({ button: reportsButton, section: reportsSection, label: "Reports" });
    reportsButton.addEventListener("click", function () {
      reportsSection.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  }

  var navigationTicking = false;
  function syncActiveNavigation() {
    navigationTicking = false;
    var marker = Math.min(window.innerHeight * 0.34, 260);
    var current = navigationEntries.length ? navigationEntries[0] : null;
    for (var entryIndex = 0; entryIndex < navigationEntries.length; entryIndex += 1) {
      if (navigationEntries[entryIndex].section.getBoundingClientRect().top <= marker) {
        current = navigationEntries[entryIndex];
      }
    }
    for (var activeIndex = 0; activeIndex < navigationEntries.length; activeIndex += 1) {
      var isCurrent = navigationEntries[activeIndex] === current;
      navigationEntries[activeIndex].button.classList.toggle("active", isCurrent);
      if (isCurrent) {
        navigationEntries[activeIndex].button.setAttribute("aria-current", "page");
        workspaceTitle.textContent = navigationEntries[activeIndex].label;
      } else {
        navigationEntries[activeIndex].button.removeAttribute("aria-current");
      }
    }
  }

  window.addEventListener("scroll", function () {
    if (!navigationTicking) {
      navigationTicking = true;
      window.requestAnimationFrame(syncActiveNavigation);
    }
  }, { passive: true });
  window.addEventListener("resize", syncActiveNavigation);
  syncActiveNavigation();
}());
</script>
